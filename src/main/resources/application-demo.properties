# Demostración local con MySQL/MariaDB de XAMPP en un puerto independiente.
server.address=127.0.0.1
spring.datasource.url=${DEMO_DATABASE_URL:jdbc:mysql://127.0.0.1:3307/biblioteca_demo_grupo3?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DEMO_DATABASE_USER:root}
spring.datasource.password=${DEMO_DATABASE_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
